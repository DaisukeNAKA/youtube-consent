name: Browser smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run static and backend checks
        run: |
          node tests/invariants.test.js
          node tests/backend.test.js
      - name: Guard against committed media in cm/
        # CM 制作一式（cm/）に肖像・声・ロゴ・書体・動画が紛れ込んでいないか（公開リポジトリのため）
        run: |
          if git ls-files cm/ | grep -iE '\.(png|jpe?g|webp|heic|gif|woff2?|ttf|otf|mp4|mov|wav|m4a|mp3)$'; then
            echo "cm/ に画像・音声・動画・書体ファイルがコミットされています（公開不可の素材の可能性）" >&2
            exit 1
          fi
      - name: Run consent and certificate checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8791 --bind 127.0.0.1 > /tmp/youtube-consent-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8791/tests/smoke.html > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8791/tests/smoke.html > /dev/null

          set +e
          timeout --kill-after=5s 30s google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/youtube-consent-chrome \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:8791/tests/smoke.html \
            > /tmp/youtube-consent-smoke.html 2> /tmp/youtube-consent-chrome.log
          chrome_status=$?
          set -e

          if [[ "$chrome_status" -ne 0 && "$chrome_status" -ne 124 ]]; then
            cat /tmp/youtube-consent-chrome.log
            exit "$chrome_status"
          fi
          if ! grep -q 'data-status="pass"' /tmp/youtube-consent-smoke.html; then
            cat /tmp/youtube-consent-smoke.html
            cat /tmp/youtube-consent-chrome.log
            exit 1
          fi
          grep -o '<pre id="result">[^<]*' /tmp/youtube-consent-smoke.html

  safari-smoke:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run smoke test in Safari
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8791 --bind 127.0.0.1 > /tmp/youtube-consent-http.log 2>&1 &
          server_pid=$!
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8791/tests/smoke.html > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8791/tests/smoke.html > /dev/null
          sudo safaridriver --enable
          safaridriver --port 4444 > /tmp/youtube-consent-safaridriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" "$server_pid" 2>/dev/null || true' EXIT
          python3 tests/webdriver_smoke.py
